name: Demo erişilebilirliği
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: demo-availability
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --experimental-strip-types scripts/monitor.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erisilebilirlik
          path: reports/availability.json
          retention-days: 14
